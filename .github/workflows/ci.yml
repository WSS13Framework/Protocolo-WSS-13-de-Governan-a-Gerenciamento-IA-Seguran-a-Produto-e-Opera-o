name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Testes do WSS13_GOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rodar suíte de testes (stdlib, sem dependências)
        working-directory: impl
        run: python -m unittest discover -s tests -v
      - name: Demonstração ponta a ponta
        working-directory: impl
        run: python run_demo.py
